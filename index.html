<title>石橋研 幹事ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: sticky tab bar over a single column. Home opens with the 幹事年 (remainder-of-5 cycle) as the main idea. */
:root {
  --bg: #F2F6F6;
  --surface: #FFFFFF;
  --ink: #16282B;
  --muted: #566B6E;
  --line: #D6E0E1;
  --accent: #2A4B8D;
  --accent-soft: #E3EAF6;
  --accent-ink: #FFFFFF;
  --ok: #24704F;
  --ok-soft: #DFF0E7;
  --warn: #8C5A00;
  --warn-soft: #FAEFD2;
  --crit: #A8322B;
  --crit-soft: #F8E1DE;
  --font-display: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1618;
    --surface: #162124;
    --ink: #E6EEEF;
    --muted: #9CB0B3;
    --line: #26383B;
    --accent: #8FB0F0;
    --accent-soft: #1D2A45;
    --accent-ink: #0E1618;
    --ok: #6FCB9F;
    --ok-soft: #173226;
    --warn: #E5B04F;
    --warn-soft: #3A2E12;
    --crit: #F08A80;
    --crit-soft: #3B1D1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1618;
  --surface: #162124;
  --ink: #E6EEEF;
  --muted: #9CB0B3;
  --line: #26383B;
  --accent: #8FB0F0;
  --accent-soft: #1D2A45;
  --accent-ink: #0E1618;
  --ok: #6FCB9F;
  --ok-soft: #173226;
  --warn: #E5B04F;
  --warn-soft: #3A2E12;
  --crit: #F08A80;
  --crit-soft: #3B1D1A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.7;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--surface);
}
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
a { color: var(--accent); }
.muted { color: var(--muted); }

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main.wrap { padding-block: 20px 56px; }

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand { padding-top: 12px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand-sub { font-size: 12px; letter-spacing: 0.08em; color: var(--muted); }
.brand h1 { font-family: var(--font-display); font-size: 20px; font-weight: 700; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs a {
  text-align: center;
  padding: 10px 4px 9px;
  color: var(--muted);
  text-decoration: none;
  font-weight: 500;
  border-bottom: 3px solid transparent;
}
.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.status {
  background: var(--warn-soft);
  color: var(--warn);
  padding: 8px 12px;
  border-radius: 6px;
  margin-bottom: 16px;
  font-size: 13px;
}

.view { display: flex; flex-direction: column; gap: 14px; }
.sec { font-family: var(--font-display); font-size: 14px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); margin-top: 10px; }
.eyebrow { font-size: 12px; letter-spacing: 0.1em; color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.card h3 { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.grid2 > * { min-width: 0; }

/* hero */
.hero { padding: 8px 0 4px; }
.hero-title { font-family: var(--font-display); font-size: clamp(24px, 6vw, 34px); line-height: 1.35; font-weight: 700; margin: 4px 0 12px; text-wrap: balance; }
.hero-title .rem { color: var(--accent); font-size: 1.25em; padding: 0 2px; }
.yearchips { display: flex; flex-wrap: wrap; gap: 8px; }
.yearchips li { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 14px; font-variant-numeric: tabular-nums; }
.yearchips li.now { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }

/* five-year cycle */
.cycle { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cyc { display: grid; grid-template-columns: 3.6rem 4rem minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 10px 16px; border-top: 1px solid var(--line); }
.cyc:first-child { border-top: 0; }
.cyc.now { background: var(--accent-soft); }
.cyc-y { font-family: var(--font-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.cyc-r { color: var(--muted); font-size: 13px; }
.cyc-m { font-variant-numeric: tabular-nums; font-size: 13px; overflow-wrap: anywhere; }
.cyc.now .cyc-r { color: var(--accent); font-weight: 700; }

/* next event */
.next-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.count { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 12px 0 4px; }
.bar i { display: block; height: 100%; background: var(--ok); }

/* tasks */
.grp { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 16px; }
.grp + .grp { margin-top: 0; }
.grp summary { cursor: pointer; padding: 14px 0; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; list-style-position: inside; }
.grp-name { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.grp-meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.grp .bar { margin-top: 0; }
.grp .hint { margin-top: 6px; }
.tasklist { padding-bottom: 6px; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.task input[type="checkbox"] { width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--accent); }
.t-title { display: block; overflow-wrap: anywhere; }
.task.done .t-title { color: var(--muted); text-decoration: line-through; }
.t-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.mini { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.mini:first-child { border-top: 0; }
.mini .t-title { flex: 1; min-width: 0; }

.pill { display: inline-block; font-size: 12px; line-height: 1.6; padding: 0 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.crit { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.pill.perm { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* forms */
.field { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
.field label, .field legend { font-size: 13px; color: var(--muted); font-weight: 500; padding: 0; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 9px 10px;
  min-height: 44px;
  width: 100%;
  min-width: 0;
}
textarea { min-height: 110px; resize: vertical; }
fieldset { border: 0; padding: 0; margin: 12px 0 0; min-width: 0; }
.seg { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.seg label { flex: 1 1 5.5rem; position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; }
.seg span { display: block; text-align: center; border: 1px solid var(--line); border-radius: 6px; padding: 9px 6px; background: var(--bg); color: var(--ink); }
.seg input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { font: inherit; font-weight: 700; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 10px 18px; min-height: 44px; cursor: pointer; margin-top: 14px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.ghost { font: inherit; font-size: 13px; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; min-height: 32px; cursor: pointer; white-space: nowrap; }
.ghost.danger { color: var(--crit); border-color: var(--crit); }
.calc-out { margin-top: 12px; }
.calc-out b { color: var(--accent); }

/* rsvp */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 28px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.yes b { color: var(--ok); }
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 16px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.row:first-child { border-top: 0; }
.row .nm { font-weight: 700; overflow-wrap: anywhere; }
.row .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

/* notes */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 13px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; min-height: 36px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 700; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.note-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.note h3 { font-family: var(--font-display); font-size: 17px; margin: 0 0 6px; overflow-wrap: anywhere; }
.note-body { white-space: pre-wrap; overflow-wrap: anywhere; }
.note-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.note-foot .acts { display: flex; gap: 8px; }

.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 18px 16px; color: var(--muted); background: var(--surface); }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
@media (max-width: 420px) {
  .cyc { grid-template-columns: 3.2rem 3.6rem minmax(0, 1fr); padding-left: 12px; padding-right: 12px; }
}
</style>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span class="brand-sub">石橋研 OB・OG会</span><h1>幹事ノート</h1></div>
    <nav class="tabs" aria-label="メニュー">
      <a href="#home" data-tab="home">ホーム</a>
      <a href="#tasks" data-tab="tasks">タスク</a>
      <a href="#rsvp" data-tab="rsvp">出欠</a>
      <a href="#notes" data-tab="notes">引き継ぎ</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <p id="status" class="status" role="status" hidden></p>

  <!-- HOME -->
  <section id="v-home" class="view">
    <div id="homeTop"></div>
    <h2 class="sec">次の行事</h2>
    <div id="homeNext"></div>
    <h2 class="sec">5年の回り方</h2>
    <div id="homeCycle"></div>
    <h2 class="sec">自分の幹事年を調べる</h2>
    <div class="card">
      <div class="field" style="margin-top:0">
        <label for="calcYear">卒業年</label>
        <input id="calcYear" type="number" inputmode="numeric" min="1950" max="2100" placeholder="例 2018">
      </div>
      <p id="calcOut" class="calc-out muted">卒業年を入れると、次の幹事年が分かります。</p>
    </div>
  </section>

  <!-- TASKS -->
  <section id="v-tasks" class="view" hidden>
    <div id="taskList"></div>
    <h2 class="sec">タスクを追加</h2>
    <div class="grid2">
      <form id="tplForm" class="card">
        <h3>テンプレートから一式を作る</h3>
        <p class="hint">開催日から逆算した期限つきで、予約から反省までのタスクが入ります。</p>
        <div class="field"><label for="tt-type">行事</label>
          <select id="tt-type"><option value="ob">OB会</option><option value="konshin">懇親会</option></select></div>
        <div class="field"><label for="tt-year">年</label><input id="tt-year" type="number" inputmode="numeric" min="2000" max="2100"></div>
        <div class="field"><label for="tt-date">開催日（期限の基準日）</label><input id="tt-date" type="date"></div>
        <button class="btn" type="submit">タスクを作る</button>
        <p id="tplMsg" class="hint" style="margin-top:8px"></p>
      </form>
      <form id="taskForm" class="card">
        <h3>1件だけ追加する</h3>
        <div class="field"><label for="nt-title">やること</label><input id="nt-title" type="text" maxlength="120" placeholder="例 ロハスカフェに人数を連絡する"></div>
        <div class="field"><label for="nt-group">対象の行事</label><select id="nt-group"></select></div>
        <div class="field"><label for="nt-due">期限</label><input id="nt-due" type="date"></div>
        <div class="field"><label for="nt-role">担当</label>
          <select id="nt-role"><option value="幹事年">幹事年</option><option value="永久幹事">永久幹事</option></select></div>
        <button class="btn" type="submit">追加する</button>
      </form>
    </div>
  </section>

  <!-- RSVP -->
  <section id="v-rsvp" class="view" hidden>
    <div class="card">
      <div class="field" style="margin-top:0"><label for="rs-group">対象の行事</label><select id="rs-group"></select></div>
    </div>
    <div id="rsvpSummary"></div>
    <h2 class="sec">出欠を回答する</h2>
    <form id="rsvpForm" class="card">
      <div class="grid2">
        <div class="field" style="margin-top:0"><label for="rs-name">名前</label><input id="rs-name" type="text" maxlength="40" autocomplete="name"></div>
        <div class="field" style="margin-top:0"><label for="rs-year">卒業年</label><input id="rs-year" type="number" inputmode="numeric" min="1950" max="2100" placeholder="例 2018"></div>
      </div>
      <fieldset>
        <legend style="font-size:13px;color:var(--muted);font-weight:500;padding:0">出欠</legend>
        <div class="seg">
          <label><input type="radio" name="rsAttend" value="yes" checked><span>参加</span></label>
          <label><input type="radio" name="rsAttend" value="maybe"><span>未定</span></label>
          <label><input type="radio" name="rsAttend" value="no"><span>不参加</span></label>
        </div>
      </fieldset>
      <div class="grid2">
        <div class="field"><label for="rs-guests">同伴の人数（本人を除く）</label><input id="rs-guests" type="number" inputmode="numeric" min="0" max="20" value="0"></div>
        <div class="field"><label for="rs-memo">ひとこと</label><input id="rs-memo" type="text" maxlength="120" placeholder="遅れて参加します など"></div>
      </div>
      <button class="btn" type="submit">回答を送る</button>
    </form>
    <h2 class="sec">回答一覧</h2>
    <div id="rsvpList"></div>
  </section>

  <!-- NOTES -->
  <section id="v-notes" class="view" hidden>
    <p class="hint">5年ぶりに幹事が回ってきたときに困らないよう、会場のこと、案内文、反省を残します。懇親会の反省会で、そのまま書き込めます。</p>
    <div id="noteChips" class="chips"></div>
    <div id="noteList" class="view"></div>
    <h2 class="sec">ノートを追加</h2>
    <form id="noteForm" class="card">
      <div class="field" style="margin-top:0"><label for="nn-title">タイトル</label><input id="nn-title" type="text" maxlength="80" placeholder="例 案内メールの文面（2026年）"></div>
      <div class="field"><label for="nn-cat">種類</label><select id="nn-cat"></select></div>
      <div class="field"><label for="nn-body">内容</label><textarea id="nn-body" maxlength="6000"></textarea></div>
      <button class="btn" type="submit">保存する</button>
    </form>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // ---------- date helpers ----------
  var NOW = new Date();
  var TODAY = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
  var Y = TODAY.getFullYear();
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
  function daysTo(s) { return Math.round((parse(s) - TODAY) / 86400000); }
  function fmt(s) { var d = parse(s); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）'; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(id) { return document.getElementById(id); }

  // ---------- 幹事年 rule: graduation year mod 5 ----------
  function nextKanjiYear(r, from) { var y = from; while (y % 5 !== r) y++; return y; }
  function members(r, upTo) {
    var y = upTo; while (y % 5 !== r) y--;
    var a = []; for (var i = 3; i >= 0; i--) a.push(y - 5 * i);
    return a;
  }

  // ---------- events ----------
  var EV = {
    ob: { name: 'OB会', start: [9, 15], end: [9, 30], when: '9月中旬' },
    konshin: { name: '懇親会', start: [12, 15], end: [12, 31], when: '12月中旬〜下旬' }
  };
  function evDate(type, year, which) { var e = EV[type][which]; return iso(new Date(year, e[0] - 1, e[1])); }
  function gid(type, year) { return type + '-' + year; }
  function gLabel(g) { var p = g.split('-'); return p[1] + '年 ' + (EV[p[0]] ? EV[p[0]].name : p[0]); }
  function gKey(g) { var p = g.split('-'); return (+p[1]) * 10 + (p[0] === 'ob' ? 1 : 2); }
  function nextEvent() {
    var list = [];
    for (var y = Y; y <= Y + 1; y++) {
      ['ob', 'konshin'].forEach(function (t) {
        list.push({ type: t, year: y, start: evDate(t, y, 'start'), end: evDate(t, y, 'end') });
      });
    }
    for (var i = 0; i < list.length; i++) { if (daysTo(list[i].end) >= 0) return list[i]; }
    return list[list.length - 1];
  }

  var TPL = {
    ob: [
      [-90, '永久幹事', 'ロハスカフェを予約する'],
      [-75, '幹事年', '日程と会費を決めて案内文を作る'],
      [-60, '幹事年', '案内を送る'],
      [-21, '幹事年', '設営・司会・会計の担当を決める'],
      [-14, '幹事年', '出欠を締め切って人数を確定する'],
      [-7, '幹事年', '当日の進行表を作る（19:00〜21:00）'],
      [0, '幹事年', '当日：設営'],
      [0, '幹事年', '当日：司会・受付・会計'],
      [7, '幹事年', '会計を精算して領収書を整理する'],
      [14, '幹事年', '反省点を引き継ぎノートに書く']
    ],
    konshin: [
      [-60, '永久幹事', '会場を予約する'],
      [-45, '幹事年', '案内文を作って送る（日時・場所・会費・出欠締切）'],
      [-21, '永久幹事', '会場の予約内容を最終確認する'],
      [-14, '幹事年', '出欠を締め切って人数を確定する'],
      [-14, '幹事年', '来年のOB会の企画案を用意する'],
      [0, '幹事年', '当日：受付・司会・会計'],
      [0, '永久幹事', '当日：反省会と来年の企画を話す'],
      [7, '幹事年', '会計を精算して領収書を整理する'],
      [14, '幹事年', '反省点を引き継ぎノートに書く']
    ]
  };
  var CATS = ['会場', '当日運営', '案内文', '反省', '引き継ぎ'];

  // ---------- state ----------
  var DB = null, canWrite = null;
  var tasks = [], rsvps = [], notes = [];
  var loaded = { tasks: false, rsvps: false, notes: false };
  var fresh = { tasks: false, rsvps: false, notes: false };
  var armed = null, editing = null, editBuf = {}, noteFilter = 'all';
  var lastOpts = '', tplInit = false;

  function can() { return !!DB && canWrite !== false; }
  function byDue(a, b) {
    var x = a.due || '9999-99-99', y = b.due || '9999-99-99';
    return x < y ? -1 : x > y ? 1 : ((a.ord || 0) - (b.ord || 0));
  }

  // ---------- UI helpers ----------
  var toastTimer = null;
  function toast(t) {
    var el = $('toast'); el.textContent = t; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }
  function setStatus(t) { var el = $('status'); if (t) { el.textContent = t; el.hidden = false; } else { el.hidden = true; } }
  function errText(e) {
    var c = e && e.code;
    if (c === 'invalid_argument') return '保存できませんでした。編集できる権限がない可能性があります。';
    if (c === 'quota_exceeded') return '保存の上限に達しました。古いデータを削除してください。';
    if (c === 'resource_exhausted') return '操作が多すぎます。少し待ってからやり直してください。';
    return '保存できませんでした。もう一度お試しください。';
  }
  async function run(fn, msg) {
    if (!DB) { toast('共有データに接続できていません'); return false; }
    try { await fn(); if (msg) toast(msg); return true; }
    catch (e) { toast(errText(e)); return false; }
  }
  function duePill(t) {
    if (t.done) return '<span class="pill ok">完了</span>';
    if (!t.due) return '';
    var d = daysTo(t.due);
    if (d < 0) return '<span class="pill crit">' + fmt(t.due) + ' 期限超過</span>';
    if (d === 0) return '<span class="pill warn">' + fmt(t.due) + ' 今日</span>';
    if (d <= 7) return '<span class="pill warn">' + fmt(t.due) + ' あと' + d + '日</span>';
    return '<span class="pill">' + fmt(t.due) + '</span>';
  }
  function rolePill(r) { return '<span class="pill' + (r === '永久幹事' ? ' perm' : '') + '">' + esc(r || '幹事年') + '</span>'; }
  function delBtn(act, id) {
    if (!can()) return '';
    var on = armed === act + id;
    return '<button type="button" class="ghost' + (on ? ' danger' : '') + '" data-act="' + act + '" data-id="' + esc(id) + '">' + (on ? '本当に削除' : '削除') + '</button>';
  }

  // ---------- group select options ----------
  function allGroups() {
    var m = {};
    ['ob', 'konshin'].forEach(function (t) { m[gid(t, Y)] = 1; m[gid(t, Y + 1)] = 1; });
    tasks.forEach(function (t) { if (t.group) m[t.group] = 1; });
    rsvps.forEach(function (r) { if (r.group) m[r.group] = 1; });
    return Object.keys(m).sort(function (a, b) { return gKey(a) - gKey(b); });
  }
  function fillGroupSelects() {
    var gs = allGroups();
    var sig = gs.join('|');
    if (sig === lastOpts) return;
    lastOpts = sig;
    var ne = nextEvent(), def = gid(ne.type, ne.year);
    ['rs-group', 'nt-group'].forEach(function (id) {
      var el = $(id), cur = el.value || def;
      el.innerHTML = gs.map(function (g) { return '<option value="' + esc(g) + '">' + esc(gLabel(g)) + '</option>'; }).join('');
      el.value = gs.indexOf(cur) >= 0 ? cur : def;
    });
  }
  function initTplDefaults() {
    if (tplInit || !loaded.tasks) return;
    tplInit = true;
    var cand = [];
    for (var y = Y; y <= Y + 3; y++) { cand.push(['ob', y]); cand.push(['konshin', y]); }
    var pick = cand[0];
    for (var i = 0; i < cand.length; i++) {
      var c = cand[i];
      if (daysTo(evDate(c[0], c[1], 'end')) >= 0 && !tasks.some(function (t) { return t.group === gid(c[0], c[1]); })) { pick = c; break; }
    }
    $('tt-type').value = pick[0]; $('tt-year').value = pick[1]; $('tt-date').value = evDate(pick[0], pick[1], 'start');
  }

  // ---------- render: home ----------
  function renderHome() {
    var r = Y % 5, mem = members(r, Y);
    $('homeTop').innerHTML =
      '<div class="hero"><p class="eyebrow">' + Y + '年の幹事年</p>' +
      '<h2 class="hero-title">' + Y + '年の幹事は、<br><span class="rem">余り' + r + '</span>の学年</h2>' +
      '<ul class="yearchips">' + mem.map(function (y) { return '<li' + (y === Y ? ' class="now"' : '') + '>' + y + '年卒</li>'; }).join('') + '</ul></div>';

    var ne = nextEvent(), g = gid(ne.type, ne.year), ev = EV[ne.type];
    var d = daysTo(ne.start), inside = d <= 0 && daysTo(ne.end) >= 0;
    var gt = tasks.filter(function (t) { return t.group === g; });
    var done = gt.filter(function (t) { return t.done; }).length;
    var open = gt.filter(function (t) { return !t.done; }).sort(byDue);
    var info = ne.type === 'ob' ? '会場 ロハスカフェ（武蔵野大学有明キャンパス）　19:00〜21:00' : '反省会を兼ねて、来年の企画も話します';
    var body;
    if (!loaded.tasks) body = '<p class="muted">読み込み中…</p>';
    else if (!gt.length) body = '<p class="muted">この回のタスクはまだありません。<a href="#tasks">タスクの画面</a>でテンプレートから作れます。</p>';
    else if (!open.length) body = '<p class="muted">タスクはすべて完了しています。</p>';
    else body = open.slice(0, 5).map(function (t) {
      return '<div class="mini"><span class="t-title">' + esc(t.title) + '</span>' + duePill(t) + '</div>';
    }).join('');
    $('homeNext').innerHTML =
      '<div class="card next"><div class="next-head"><div><h3>' + ne.year + '年 ' + ev.name + '</h3>' +
      '<p class="muted">' + ev.when + '（' + fmt(ne.start) + 'ごろ〜）</p></div>' +
      '<p class="count">' + (inside ? '開催期間中' : 'あと' + d + '日') + '</p></div>' +
      '<p style="margin-top:8px">' + esc(info) + '</p>' +
      (gt.length ? '<div class="bar" aria-hidden="true"><i style="width:' + Math.round(done * 100 / gt.length) + '%"></i></div><p class="hint">' + done + '/' + gt.length + ' 完了</p>' : '') +
      '<div style="margin-top:8px">' + body + '</div></div>';

    var rows = '';
    for (var k = 0; k < 5; k++) {
      var y = Y + k, rr = y % 5;
      rows += '<li class="cyc' + (k === 0 ? ' now' : '') + '"><span class="cyc-y">' + y + '</span><span class="cyc-r">余り' + rr + '</span><span class="cyc-m">' + members(rr, y).join('・') + '年卒</span></li>';
    }
    $('homeCycle').innerHTML = '<ul class="cycle">' + rows + '</ul><p class="hint" style="margin-top:8px">' + (Y + 5) + '年に、また余り' + r + 'の学年へ戻ります。</p>';
  }

  // ---------- render: tasks ----------
  function taskHtml(t) {
    return '<li class="task' + (t.done ? ' done' : '') + '">' +
      '<input type="checkbox" id="t_' + esc(t.id) + '" data-act="toggle" data-id="' + esc(t.id) + '"' + (t.done ? ' checked' : '') + (can() ? '' : ' disabled') + '>' +
      '<div><label class="t-title" for="t_' + esc(t.id) + '">' + esc(t.title) + '</label>' +
      '<div class="t-meta">' + rolePill(t.role) + duePill(t) + '</div></div>' +
      '<div>' + delBtn('del-task', t.id) + '</div></li>';
  }
  function groupHtml(g, open) {
    var list = tasks.filter(function (t) { return t.group === g; }).sort(byDue);
    var done = list.filter(function (t) { return t.done; }).length;
    var base = (list.filter(function (t) { return t.eventDate; })[0] || {}).eventDate;
    return '<details class="grp"' + (open ? ' open' : '') + '><summary><span class="grp-name">' + esc(gLabel(g)) + '</span><span class="grp-meta">' + done + '/' + list.length + ' 完了</span></summary>' +
      '<div class="bar" aria-hidden="true"><i style="width:' + Math.round(done * 100 / list.length) + '%"></i></div>' +
      (base ? '<p class="hint">期限の基準日 ' + fmt(base) + '</p>' : '') +
      '<ul class="tasklist">' + list.map(taskHtml).join('') + '</ul></details>';
  }
  function renderTasks() {
    var el = $('taskList');
    if (!loaded.tasks) { el.innerHTML = '<p class="muted">読み込み中…</p>'; return; }
    var m = {}; tasks.forEach(function (t) { m[t.group] = 1; });
    var gs = Object.keys(m);
    if (!gs.length) { el.innerHTML = '<div class="empty">タスクはまだありません。下のテンプレートから、OB会や懇親会の一式を作れます。</div>'; return; }
    function isPast(g) { var p = g.split('-'); return EV[p[0]] && daysTo(evDate(p[0], +p[1], 'end')) < 0; }
    var up = gs.filter(function (g) { return !isPast(g); }).sort(function (a, b) { return gKey(a) - gKey(b); });
    var past = gs.filter(isPast).sort(function (a, b) { return gKey(b) - gKey(a); });
    el.innerHTML = '<div class="view">' + up.map(function (g) { return groupHtml(g, true); }).join('') +
      (past.length ? '<h2 class="sec">終わった行事</h2>' + past.map(function (g) { return groupHtml(g, false); }).join('') : '') + '</div>';
  }

  // ---------- render: rsvp ----------
  var ATT = { yes: ['参加', 'ok'], maybe: ['未定', 'warn'], no: ['不参加', ''] };
  function renderRsvp() {
    var g = $('rs-group').value;
    var sum = $('rsvpSummary'), listEl = $('rsvpList');
    if (!loaded.rsvps) { sum.innerHTML = ''; listEl.innerHTML = '<p class="muted">読み込み中…</p>'; return; }
    var list = rsvps.filter(function (r) { return r.group === g; }).sort(function (a, b) {
      return ((a.gradYear || 0) - (b.gradYear || 0)) || String(a.name).localeCompare(String(b.name), 'ja');
    });
    var yes = list.filter(function (r) { return r.attend === 'yes'; });
    var no = list.filter(function (r) { return r.attend === 'no'; });
    var maybe = list.filter(function (r) { return r.attend === 'maybe'; });
    var heads = yes.reduce(function (s, r) { return s + 1 + (+r.guests || 0); }, 0);
    var byYear = {};
    yes.forEach(function (r) { var k = r.gradYear || 0; byYear[k] = (byYear[k] || 0) + 1 + (+r.guests || 0); });
    var yearChips = Object.keys(byYear).sort().map(function (k) { return '<span class="pill">' + (k === '0' ? '卒業年なし' : k + '年卒') + ' ' + byYear[k] + '人</span>'; }).join(' ');
    sum.innerHTML = '<div class="stats">' +
      '<div class="stat yes"><b>' + heads + '</b><span>参加（同伴を含む人数）</span></div>' +
      '<div class="stat"><b>' + maybe.length + '</b><span>未定</span></div>' +
      '<div class="stat"><b>' + no.length + '</b><span>不参加</span></div></div>' +
      (yearChips ? '<div class="t-meta" style="margin-top:10px">' + yearChips + '</div>' : '');
    if (!list.length) {
      listEl.innerHTML = '<div class="empty">' + esc(gLabel(g || gid('konshin', Y))) + 'の回答はまだありません。上のフォームから最初の回答を送れます。</div>';
      return;
    }
    listEl.innerHTML = '<div class="rows">' + list.map(function (r) {
      var a = ATT[r.attend] || ['未定', 'warn'];
      return '<div class="row"><div><div class="nm">' + esc(r.name) + ' <span class="pill ' + a[1] + '">' + a[0] + '</span></div>' +
        '<div class="sub">' + (r.gradYear ? esc(r.gradYear) + '年卒' : '') + (+r.guests ? '　同伴' + (+r.guests) + '人' : '') + (r.memo ? '　' + esc(r.memo) : '') + '</div></div>' +
        '<div>' + delBtn('del-rsvp', r.id) + '</div></div>';
    }).join('') + '</div>';
  }

  // ---------- render: notes ----------
  function renderNotes() {
    var chips = ['all'].concat(CATS);
    $('noteChips').innerHTML = chips.map(function (c) {
      var n = c === 'all' ? notes.length : notes.filter(function (x) { return x.cat === c; }).length;
      return '<button type="button" class="chip" data-act="chip" data-id="' + esc(c) + '" aria-pressed="' + (noteFilter === c) + '">' + (c === 'all' ? 'すべて' : esc(c)) + ' ' + n + '</button>';
    }).join('');
    var el = $('noteList');
    if (!loaded.notes) { el.innerHTML = '<p class="muted">読み込み中…</p>'; return; }
    var list = notes.filter(function (n) { return noteFilter === 'all' || n.cat === noteFilter; })
      .sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
    if (!list.length) { el.innerHTML = '<div class="empty">この種類のノートはまだありません。下のフォームから書き残せます。</div>'; return; }
    el.innerHTML = list.map(function (n) {
      if (editing === n.id) {
        return '<div class="note"><div class="field" style="margin-top:0"><label for="e-title">タイトル</label><input id="e-title" type="text" data-edit="title" value="' + esc(editBuf.title) + '"></div>' +
          '<div class="field"><label for="e-cat">種類</label><select id="e-cat" data-edit="cat">' + CATS.map(function (c) { return '<option' + (c === editBuf.cat ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></div>' +
          '<div class="field"><label for="e-body">内容</label><textarea id="e-body" data-edit="body">' + esc(editBuf.body) + '</textarea></div>' +
          '<div class="note-foot"><span></span><div class="acts"><button type="button" class="ghost" data-act="cancel-note">やめる</button><button type="button" class="btn" style="margin:0" data-act="save-note" data-id="' + esc(n.id) + '">保存する</button></div></div></div>';
      }
      var up = n.updatedAt ? new Date(n.updatedAt) : null;
      return '<article class="note"><div class="note-top"><span class="pill perm">' + esc(n.cat) + '</span></div><h3>' + esc(n.title) + '</h3>' +
        '<p class="note-body">' + esc(n.body) + '</p><div class="note-foot"><span class="hint">' + (up ? '更新 ' + (up.getMonth() + 1) + '/' + up.getDate() : '') + '</span>' +
        (can() ? '<div class="acts"><button type="button" class="ghost" data-act="edit-note" data-id="' + esc(n.id) + '">編集</button>' + delBtn('del-note', n.id) + '</div>' : '') + '</div></article>';
    }).join('');
  }

  function applyPerm() {
    var off = !can();
    document.querySelectorAll('form').forEach(function (f) {
      f.querySelectorAll('input,select,textarea,button').forEach(function (x) { x.disabled = off; });
    });
    if (DB && canWrite === false) setStatus('閲覧専用です。書き込むには、共有で編集できる権限が必要です。');
  }
  function renderAll() {
    fillGroupSelects(); initTplDefaults();
    renderHome(); renderTasks(); renderRsvp(); renderNotes(); applyPerm();
  }

  // ---------- routing ----------
  var VIEWS = ['home', 'tasks', 'rsvp', 'notes'];
  function route() {
    var h = location.hash.replace('#', '');
    if (VIEWS.indexOf(h) < 0) h = 'home';
    VIEWS.forEach(function (v) { $('v-' + v).hidden = (v !== h); });
    document.querySelectorAll('.tabs a').forEach(function (a) {
      if (a.getAttribute('data-tab') === h) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  // ---------- events ----------
  var COL = { 'del-task': 'tasks', 'del-rsvp': 'rsvps', 'del-note': 'notes' };
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b || b.getAttribute('data-act') === 'toggle') return;
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
    if (COL[act]) {
      var key = act + id;
      if (armed !== key) {
        armed = key; renderAll();
        setTimeout(function () { if (armed === key) { armed = null; renderAll(); } }, 4000);
        return;
      }
      armed = null;
      run(function () { return DB.collection(COL[act]).doc(id).delete(); }, '削除しました');
    } else if (act === 'chip') { noteFilter = id; renderNotes(); }
    else if (act === 'edit-note') {
      var n = notes.filter(function (x) { return x.id === id; })[0]; if (!n) return;
      editing = id; editBuf = { title: n.title, cat: n.cat, body: n.body }; renderNotes();
    } else if (act === 'cancel-note') { editing = null; renderNotes(); }
    else if (act === 'save-note') {
      if (!String(editBuf.title || '').trim()) { toast('タイトルを入れてください'); return; }
      run(function () {
        return DB.collection('notes').doc(id).update({ title: editBuf.title.trim(), cat: editBuf.cat, body: editBuf.body || '', updatedAt: Date.now() });
      }, '保存しました').then(function (ok) { if (ok) { editing = null; renderNotes(); } });
    }
  });
  document.addEventListener('change', function (e) {
    var b = e.target;
    if (b.getAttribute && b.getAttribute('data-act') === 'toggle') {
      var id = b.getAttribute('data-id'), v = !!b.checked;
      run(function () { return DB.collection('tasks').doc(id).update({ done: v }); }, '');
    }
  });
  document.addEventListener('input', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-edit');
    if (k) editBuf[k] = e.target.value;
  });
  $('rs-group').addEventListener('change', renderRsvp);
  function syncTplDate() {
    var t = $('tt-type').value, y = parseInt($('tt-year').value, 10);
    if (y) $('tt-date').value = evDate(t, y, 'start');
  }
  $('tt-type').addEventListener('change', syncTplDate);
  $('tt-year').addEventListener('change', syncTplDate);

  $('calcYear').addEventListener('input', function () {
    var g = parseInt(this.value, 10), out = $('calcOut');
    if (!g || g < 1950 || g > 2100) { out.className = 'calc-out muted'; out.textContent = '卒業年を入れると、次の幹事年が分かります。'; return; }
    var r = g % 5, ny = nextKanjiYear(r, Y);
    out.className = 'calc-out';
    out.innerHTML = g + '年卒は<b>余り' + r + '</b>のグループです。' + (ny === Y ? '今年（' + Y + '年）が幹事年です。' : '次の幹事年は<b>' + ny + '年</b>です（あと' + (ny - Y) + '年）。');
  });

  $('tplForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var type = $('tt-type').value, year = parseInt($('tt-year').value, 10), date = $('tt-date').value, msg = $('tplMsg');
    if (!year || !date) { msg.textContent = '年と開催日を入れてください。'; return; }
    var g = gid(type, year);
    if (tasks.some(function (t) { return t.group === g; })) { msg.textContent = gLabel(g) + 'のタスクは既にあります。'; return; }
    msg.textContent = '作成中…';
    var list = TPL[type], ok = true;
    for (let i = 0; i < list.length && ok; i++) {
      var it = list[i];
      ok = await run(function () {
        return DB.collection('tasks').doc(g + '-' + pad(i)).set({ group: g, event: type, year: year, title: it[2], role: it[1], due: addDays(date, it[0]), eventDate: date, done: false, ord: i });
      }, '');
    }
    msg.textContent = ok ? '' : '途中で止まりました。もう一度お試しください。';
    if (ok) toast(gLabel(g) + 'のタスクを作りました');
  });

  $('taskForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var title = $('nt-title').value.trim(); if (!title) { toast('やることを入れてください'); return; }
    var g = $('nt-group').value, p = g.split('-');
    var ok = await run(function () {
      return DB.collection('tasks').add({ group: g, event: p[0], year: +p[1], title: title, role: $('nt-role').value, due: $('nt-due').value || '', done: false, ord: 100 });
    }, '追加しました');
    if (ok) { $('nt-title').value = ''; $('nt-due').value = ''; }
  });

  $('rsvpForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var name = $('rs-name').value.trim(), yr = parseInt($('rs-year').value, 10);
    if (!name) { toast('名前を入れてください'); return; }
    if (!yr || yr < 1950 || yr > 2100) { toast('卒業年を入れてください'); return; }
    var att = document.querySelector('input[name="rsAttend"]:checked').value;
    var guests = Math.max(0, Math.min(20, parseInt($('rs-guests').value, 10) || 0));
    var ok = await run(function () {
      return DB.collection('rsvps').add({ group: $('rs-group').value, name: name, gradYear: yr, attend: att, guests: guests, memo: $('rs-memo').value.trim(), createdAt: Date.now() });
    }, '回答を保存しました');
    if (ok) { $('rs-name').value = ''; $('rs-memo').value = ''; $('rs-guests').value = '0'; }
  });

  $('noteForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var title = $('nn-title').value.trim(); if (!title) { toast('タイトルを入れてください'); return; }
    var ok = await run(function () {
      return DB.collection('notes').add({ title: title, cat: $('nn-cat').value, body: $('nn-body').value, updatedAt: Date.now() });
    }, '保存しました');
    if (ok) { $('nn-title').value = ''; $('nn-body').value = ''; }
  });

  // ---------- boot ----------
  $('nn-cat').innerHTML = CATS.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
  route();
  renderAll();

  function listen(col, assign) {
    DB.collection(col).onSnapshot(function (s) {
      assign(s.docs.map(function (d) { var o = d.data() || {}; o.id = d.id; return o; }));
      if (!s.metadata.fromCache || s.size > 0) loaded[col] = true;
      if (!s.metadata.fromCache) fresh[col] = true;
      if (fresh.tasks && fresh.rsvps && fresh.notes && !(DB && canWrite === false)) setStatus('');
      renderAll();
    }, function () {
      loaded[col] = true; setStatus('共有データを読み込めませんでした。ページを開き直してください。'); renderAll();
    });
  }

  (async function boot() {
    var c = window.claude;
    try { DB = c && c.use ? await c.use('db') : null; } catch (e) { DB = null; }
    try {
      var user = c && c.use ? await c.use('user') : null;
      if (user && user.can) canWrite = await user.can('data.write');
    } catch (e) { canWrite = null; }
    if (!DB) {
      loaded = { tasks: true, rsvps: true, notes: true };
      setStatus('共有データにつながっていません。サインインして、共有されたリンクから開いてください。');
      renderAll(); return;
    }
    setTimeout(function () {
      if (!(fresh.tasks && fresh.rsvps && fresh.notes)) setStatus('共有データがまだ届いていません。表示が古い可能性があります。');
    }, 10000);
    listen('tasks', function (a) { tasks = a; });
    listen('rsvps', function (a) { rsvps = a; });
    listen('notes', function (a) { notes = a; });
    applyPerm();
  })();
})();
</script>
